<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Pagina nu există | DC — Daniel Cioc</title>
  <style>
:root, [data-theme="light"] {
  --bg: #f5f5f7;
  --bg-elevated: #ffffff;
  --surface: #ffffff;
  --surface-muted: #f0f0f3;
  --glass: rgba(251, 251, 253, 0.82);
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.14);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04);
  --shadow-hover: 0 20px 44px rgba(0, 0, 0, 0.09);
  --glow-a: rgba(0, 113, 227, 0.06);
  --glow-b: rgba(191, 90, 242, 0.05);
  --radius: 22px;
}
[data-theme="dark"] {
  --bg: #000000;
  --bg-elevated: #161617;
  --surface: #161617;
  --surface-muted: #1d1d1f;
  --glass: rgba(22, 22, 23, 0.78);
  --border: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.2);
  --text: #f5f5f7;
  --muted: #a1a1a6;
  --accent: #2997ff;
  --accent-hover: #47a6ff;
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 24px 50px rgba(0, 0, 0, 0.65);
  --glow-a: rgba(41, 151, 255, 0.1);
  --glow-b: rgba(191, 90, 242, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.35s ease, color 0.35s ease;
  position: relative;
}
body::before {
  content: "";
  position: fixed; inset: -25%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 18% 10%, var(--glow-a), transparent 42%),
    radial-gradient(circle at 84% 14%, var(--glow-b), transparent 44%);
  animation: gentleDrift 26s ease-in-out infinite alternate;
}
@keyframes gentleDrift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(-2%, 2%, 0) scale(1.04); }
}
@keyframes tickerSlide {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  body::before, .ticker-track { animation: none !important; }
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }
.read-progress {
  position: fixed; top: 0; left: 0; height: 2.5px; width: 0%; z-index: 70;
  background: linear-gradient(90deg, #0071e3, #5e5ce6, #bf5af2);
  transition: width 0.08s linear;
}
/* Minimal Apple-style news ticker */
.ticker-bar {
  background: var(--surface-muted);
  border-bottom: 1px solid var(--border);
  overflow: hidden; white-space: nowrap; font-size: 0.76rem;
  display: flex; align-items: center;
}
.ticker-label {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--accent); border-right: 1px solid var(--border); z-index: 2;
  background: var(--surface-muted);
}
.ticker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ticker-viewport { overflow: hidden; flex: 1; }
.ticker-track { display: inline-flex; gap: 36px; padding: 6px 0 6px 24px; animation: tickerSlide 44s linear infinite; }
.ticker-track:hover { animation-play-state: paused; }
.ticker-item { color: var(--muted); font-weight: 500; transition: color 0.18s; }
.ticker-item:hover { color: var(--text); }
/* Frosted Apple navbar */
header.site-header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  background: var(--glass);
  border-bottom: 1px solid var(--border);
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 10px 0; flex-wrap: wrap;
}
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand-logo { width: 34px; height: 34px; transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
.brand:hover .brand-logo { transform: scale(1.06); }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name { font-weight: 700; font-size: 1.04rem; letter-spacing: -0.02em; color: var(--text); }
.brand-sub { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-top: 1px; }
.nav-links { display: flex; align-items: center; gap: 20px; font-size: 0.84rem; font-weight: 500; color: var(--muted); flex-wrap: wrap; }
.nav-links a { transition: color 0.18s; }
.nav-links a:hover { color: var(--text); }
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon-pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 0.76rem; font-weight: 600; cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s, box-shadow 0.2s;
}
.icon-pill:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--shadow-card); }
.icon-pill.ig:hover { border-color: #e1306c; }
.icon-pill.tt:hover { border-color: var(--accent); }
[data-theme="light"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
.lang-toggle {
  display: inline-flex; background: var(--surface-muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px;
}
.lang-link {
  padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 0.74rem;
  color: var(--muted); transition: all 0.2s;
}
.lang-link.active { background: var(--text); color: var(--bg); }
/* Spotlight Search & Filter Toolbar */
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 28px 0 22px; }
.search-input {
  flex: 1 1 250px; min-width: 220px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: 14px; padding: 10px 16px; font-size: 0.92rem;
  box-shadow: var(--shadow-card);
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s;
}
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.16); }
.filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.81rem; font-weight: 600;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.pill:hover { border-color: var(--border-strong); color: var(--text); }
.pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }
/* Lead Featured Story (Apple Newsroom style) */
.featured-card {
  display: grid; grid-template-columns: 1.25fr 1fr; gap: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 26px;
  overflow: hidden; margin-bottom: 26px; box-shadow: var(--shadow-card);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.25s;
}
@media (max-width: 860px) { .featured-card { grid-template-columns: 1fr; } }
.featured-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
.featured-img-wrap { position: relative; min-height: 290px; max-height: 430px; overflow: hidden; background: var(--surface-muted); }
.featured-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
.featured-card:hover .featured-img { transform: scale(1.03); }
.featured-body { padding: 34px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.featured-body h1 { font-size: clamp(1.48rem, 2.5vw, 2.15rem); line-height: 1.15; letter-spacing: -0.03em; font-weight: 700; }
.featured-body p.excerpt { color: var(--muted); font-size: 0.98rem; line-height: 1.55; }
/* Editorial Grid Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(315px, 1fr)); gap: 22px; padding-bottom: 42px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow-card);
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease, border-color 0.25s;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
.card-img-wrap { overflow: hidden; aspect-ratio: 16/9; background: var(--surface-muted); }
.card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
.card:hover .card-img { transform: scale(1.035); }
.card-body { padding: 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.76rem; color: var(--muted); font-weight: 500; }
.tag-badge {
  font-weight: 700; font-size: 0.68rem; padding: 3px 9px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.04em; color: #fff;
}
.card h2 { font-size: 1.14rem; line-height: 1.3; letter-spacing: -0.02em; font-weight: 700; }
.card p.excerpt { color: var(--muted); font-size: 0.9rem; flex: 1; line-height: 1.55; }
.read-more { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
.ad-infeed { grid-column: 1 / -1; }
/* Subtle clean Ad container */
.ad-slot {
  margin: 18px 0; padding: 10px 14px 14px;
  border-radius: 16px; border: 1px solid var(--border);
  background: var(--surface-muted); text-align: center;
}
.ad-slot-label {
  display: block; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); opacity: 0.7; margin-bottom: 6px;
}
/* Article View */
.article-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 295px; gap: 30px;
  margin: 28px auto 60px; align-items: start;
}
@media (max-width: 960px) { .article-layout { grid-template-columns: 1fr; } }
article.post-shell { min-width: 0; }
aside.article-sidebar { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 18px; }
.sidebar-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow-card);
}
.sidebar-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.sidebar-card p { font-size: 0.86rem; color: var(--muted); }
.back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; margin-bottom: 14px; font-size: 0.88rem; }
.post-header h1 { font-size: clamp(1.85rem, 3.4vw, 2.6rem); line-height: 1.12; letter-spacing: -0.032em; font-weight: 700; margin: 12px 0; }
.post-meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 0.84rem; margin-bottom: 20px; align-items: center; }
.hero-media-wrap { margin-bottom: 24px; }
.post-hero { width: 100%; max-height: 510px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); display: block; box-shadow: var(--shadow-card); }
.photo-credit { font-size: 0.68rem; color: var(--muted); opacity: 0.62; text-align: right; margin-top: 6px; }
.highlights-box {
  background: var(--surface); border: 1px solid var(--border); border-left: 3.5px solid var(--accent);
  border-radius: 16px; padding: 20px 22px; margin-bottom: 22px; box-shadow: var(--shadow-card);
}
.highlights-box h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 10px; }
.highlights-box ul { padding-left: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 0.95rem; }
.post-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 34px; font-size: 1.05rem; line-height: 1.78;
  box-shadow: var(--shadow-card);
}
.post-content h2 { font-size: 1.32rem; letter-spacing: -0.02em; margin: 26px 0 10px; color: var(--text); }
.post-content h2:first-child { margin-top: 0; }
.post-content p + p { margin-top: 16px; }
.author-card {
  margin-top: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 18px 22px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-card);
}
.author-avatar { width: 44px; height: 44px; flex-shrink: 0; }
.author-info h4 { font-size: 0.95rem; font-weight: 700; }
.author-info p { font-size: 0.84rem; color: var(--muted); margin-top: 2px; }
.share-bar { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; align-items: center; }
.share-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 0.81rem; font-weight: 600; cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}
.share-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 24px; }
.gallery img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); }
.legal-shell {
  max-width: 820px; margin: 36px auto 64px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 36px; box-shadow: var(--shadow-card);
}
.legal-shell h1 { font-size: 2rem; letter-spacing: -0.03em; margin-bottom: 14px; }
.legal-shell h2 { font-size: 1.18rem; margin: 24px 0 8px; color: var(--accent); }
.legal-shell p, .legal-shell li { color: var(--muted); margin-bottom: 10px; }
.legal-shell ul { padding-left: 20px; }
/* Scroll Reveal */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
/* Footer */
footer.site-footer {
  border-top: 1px solid var(--border); padding: 34px 0 42px;
  color: var(--muted); font-size: 0.82rem; background: var(--surface);
}
.footer-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 24px; margin-bottom: 22px; }
@media (max-width: 780px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-col h4 { color: var(--text); font-size: 0.8rem; margin-bottom: 9px; text-transform: uppercase; letter-spacing: 0.05em; }
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.footer-col a { display: inline-flex; align-items: center; gap: 6px; transition: color 0.18s; }
.footer-col a:hover, .cookie-link:hover { color: var(--accent); }
.footer-bottom { border-top: 1px solid var(--border); padding-top: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.cookie-link { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; text-decoration: underline; }
/* EU GDPR Cookie Banner */
.gdpr-banner {
  position: fixed; bottom: 18px; right: 18px; left: 18px; max-width: 450px; margin-left: auto;
  z-index: 80; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
  display: none;
}
.gdpr-banner.show { display: block; animation: fadeUp 0.35s ease; }
.gdpr-banner h4 { font-size: 0.95rem; margin-bottom: 6px; color: var(--text); }
.gdpr-banner p { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
.gdpr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-accept {
  background: var(--accent); color: #ffffff; border: 0; border-radius: 999px;
  padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.8rem;
}
.btn-accept:hover { background: var(--accent-hover); }
.btn-essential {
  background: var(--surface-muted); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.8rem;
}
</style>
</head>
<body>
  <main class="wrap" style="text-align:center;padding:90px 24px;">
    <h1>404 &mdash; Pagina nu a fost găsită</h1>
    <p style="margin:14px 0 26px;color:var(--muted);">Resursa căutată nu există sau a fost mutată.</p>
    <a class="pill active" href="/">Înapoi la cioc.online</a>
  </main>
</body>
</html>
